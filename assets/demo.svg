<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">dsh-native-playbook terminal demonstration</title>
  <desc id="desc">A task to run tests in the background maps to native bash and job_output capabilities, with no external plugin needed.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="26" fill="#eef2ff"/>
  <rect x="36" y="30" width="1128" height="320" rx="18" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="36" y="30" width="1128" height="52" rx="18" fill="#1f2937"/>
  <rect x="36" y="64" width="1128" height="18" fill="#1f2937"/>
  <circle cx="70" cy="56" r="7" fill="#fb7185"/>
  <circle cx="94" cy="56" r="7" fill="#fbbf24"/>
  <circle cx="118" cy="56" r="7" fill="#34d399"/>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#94a3b8">dsh-native</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">
    <text x="74" y="128" fill="#67e8f9">$</text>
    <text x="100" y="128" fill="#f8fafc">dsh-native lookup &quot;run tests in background&quot;</text>
    <text x="74" y="176" fill="#94a3b8">Task:</text>
    <text x="150" y="176" fill="#e2e8f0">run tests in background</text>
    <text x="74" y="216" fill="#94a3b8">Native recommendation:</text>
    <text x="104" y="256" fill="#34d399">✓ bash</text>
    <text x="252" y="256" fill="#a5b4fc">run_in_background=true</text>
    <text x="104" y="294" fill="#34d399">✓ job_output</text>
    <text x="74" y="330" fill="#94a3b8">External plugin needed:</text>
    <text x="360" y="330" fill="#34d399">no</text>
  </g>
</svg>
